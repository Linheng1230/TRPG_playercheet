<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-label="Original Western fantasy watercolor border with winged dragon, griffin, castle and pine forest">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b2bdd0" stop-opacity=".17"/><stop offset="1" stop-color="#e7d9b5" stop-opacity="0"/></linearGradient>
 <linearGradient id="scale" x1="0" x2="1" y1=".1" y2=".95"><stop stop-color="#93a595"/><stop offset=".52" stop-color="#a59a7c"/><stop offset="1" stop-color="#d0b596"/></linearGradient>
 <linearGradient id="leather" x2="1" y2="1"><stop stop-color="#bc9f86" stop-opacity=".81"/><stop offset="1" stop-color="#e9d2b2" stop-opacity=".4"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#b2b9ae" stop-opacity=".42"/><stop offset="1" stop-color="#d9d1b6" stop-opacity=".14"/></linearGradient>
 <filter id="wash" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="grain" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".015" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.9" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs>
<!-- Open center: decorative landscapes and creatures live on outer edges. -->
<g opacity=".65" filter="url(#wash)">
