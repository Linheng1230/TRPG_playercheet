 <path d="M175 259Q210 272 250 254M182 278Q217 291 255 277" fill="none" stroke="#ebe1c5" stroke-width="2" opacity=".7"/>
</g>
<!-- Left edge: small griffin, eagle head / feather wings / leonine hindquarters, Western fantasy beast. -->
