 <path d="M152 251Q214 292 276 272" fill="none" stroke="#d5c2a8" stroke-width="4"/>
 <!-- wing origin overlap -->
 <path d="M177 210Q207 210 231 228L247 256Q203 249 171 236Z" fill="#aaa28c"/>
 <!-- forelegs two separate -->
 <path d="M158 273Q173 314 159 365L184 387L176 402L146 391L133 368L123 296Z" fill="url(#scale)"/>
 <path d="M210 296Q235 339 215 377L238 398L232 409L201 398L188 377L187 311Z" fill="url(#scale)"/>
 <path d="M171 390L177 408L184 393M207 396L211 411L219 400M224 403L231 416L238 407" fill="none"/>
 <!-- neck, chest, western horned head with jaw and nostrils -->
 <path d="M129 248Q109 218 85 190L49 179L33 166L44 156L19 148L31 135L58 132L74 115L94 128L110 124L112 150Q142 169 160 218Z" fill="url(#scale)" stroke-width="3"/>
