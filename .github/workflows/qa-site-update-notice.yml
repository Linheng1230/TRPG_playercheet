name: Site Version Update Notice QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'home.html'
      - 'scripts/prepare-pages-site.cjs'
      - 'assets/site-update-notice.js'
      - 'assets/site-update-notice.css'
      - 'tests/qa-site-update-notice*.cjs'
      - '.github/workflows/qa-site-update-notice.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home.html'
      - 'scripts/prepare-pages-site.cjs'
      - 'assets/site-update-notice.js'
      - 'assets/site-update-notice.css'
      - 'tests/qa-site-update-notice*.cjs'
      - '.github/workflows/qa-site-update-notice.yml'

permissions:
  contents: read

jobs:
  version-update-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release SHA stamping and static package
        run: node tests/qa-site-update-notice.cjs
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify update notification, defer, save and reload in Chromium
        run: node tests/qa-site-update-notice-browser.cjs
