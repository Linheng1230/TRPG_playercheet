name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify magic-item import
        run: node tests/qa-magic-item-import.js
      - name: Verify damage resistance reference
        run: node tests/qa-resistance-reference-5r.js
      - name: Verify settlement shop and magic item pricing
        run: node tests/qa-shop-market.js
      - name: Verify short and long rest recovery
        run: node tests/qa-play-status-rest.js
      - name: Verify custom town shops
        run: node tests/qa-shop-stores.cjs
      # This is a release-blocking browser gate, not only a PR check.
      # All new UI must project canonical 2024 translations before deploying.
      - name: Prepare 2024 translation browser gate
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 -m http.server 18766 --bind 127.0.0.1 >/tmp/trpg-release-translation-http.log 2>&1 &
          sleep 2
      - name: Block deployment on canonical translation drift
        env:
          QA_BASE: http://127.0.0.1:18766
        run: node tests/qa-translation-projection-gate.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
