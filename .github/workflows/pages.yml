name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify magic-item import
        run: node tests/qa-magic-item-import.js
      - name: Verify damage resistance reference
        run: node tests/qa-resistance-reference-5r.js
      - name: Verify settlement shop and magic item pricing
        run: node tests/qa-shop-market.js
      - name: Verify short and long rest recovery
        run: node tests/qa-play-status-rest.js
      - name: Verify one-step play status undo
        run: node tests/qa-play-status-undo.js
      - name: Verify custom town shops
        run: node tests/qa-shop-stores.cjs
      # This is a release-blocking browser gate, not only a PR check.
      # All new UI must project canonical 2024 translations before deploying.
      - name: Prepare 2024 translation browser gate
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 -m http.server 18766 --bind 127.0.0.1 >/tmp/trpg-release-translation-http.log 2>&1 &
          sleep 2
      - name: Block deployment on canonical translation drift
        env:
          QA_BASE: http://127.0.0.1:18766
        run: node tests/qa-translation-projection-gate.js
      - name: Verify undo real clicks on mobile and desktop
        run: node tests/qa-play-status-undo-browser.js
      - name: Verify purchased mounts and equipment links
        run: node tests/qa-shop-gear-link.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published rest UI and script
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          QA_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          valid=0
          for attempt in $(seq 1 12); do
            if curl -fLsS --retry 2 --max-time 25 "${base}/?qa=${QA_SHA}" -o /tmp/rest-live-index.html \
              && grep -Fq 'assets/play-status-rest-5r.js?v=20261114-v2' /tmp/rest-live-index.html \
              && grep -Fq 'data-ps-action="rest-short"' /tmp/rest-live-index.html \
              && grep -Fq 'data-ps-action="rest-long"' /tmp/rest-live-index.html \
              && curl -fLsS --retry 2 --max-time 25 "${base}/assets/play-status-rest-5r.js?qa=${QA_SHA}" -o /tmp/rest-live-module.js \
              && grep -Fq 'PlayStatusRest5R' /tmp/rest-live-module.js \
              && grep -Fq '是否使用生命骰？' /tmp/rest-live-module.js; then
              valid=1
              break
            fi
            sleep 5
          done
          if [ "${valid}" != 1 ]; then
            echo 'FAIL: published Pages missing short/long rest UI or latest rest module'
            exit 1
          fi
          echo 'PASS: published Pages serves both rest buttons and updated yes/no hit dice script'
      - name: Verify published undo entry and module
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          QA_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          curl -fLsS --retry 4 --max-time 30 "${base}/?qa=${QA_SHA}" -o /tmp/undo-live-index.html
          grep -Fq 'data-ps-action="undo"' /tmp/undo-live-index.html
          grep -Fq 'assets/play-status-undo-5r.js?v=20261114-v1' /tmp/undo-live-index.html
          curl -fLsS --retry 4 --max-time 30 "${base}/assets/play-status-undo-5r.js?qa=${QA_SHA}" -o /tmp/undo-live-module.js
          grep -Fq 'PlayStatusUndo5R' /tmp/undo-live-module.js
      - name: Live UAT - imported QA character on published Pages
        env:
          QA_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/qa-play-status-undo-live.cjs
