name: QA Final Sheet UX Desktop Mobile

on:
  push:
    branches: [main, feat/ux-final-sheet-clarity-20261114]
    paths:
      - index.html
      - assets/final-sheet-ux-5r.css
      - tests/qa-final-sheet-ux.js
      - tests/qa-final-sheet-jump-nav.js
      - tests/qa-final-spell-sheet-metadata.js
      - .github/workflows/qa-final-sheet-ux.yml
  pull_request:
    paths:
      - index.html
      - assets/final-sheet-ux-5r.css
      - tests/qa-final-sheet-ux.js
      - tests/qa-final-sheet-jump-nav.js
      - tests/qa-final-spell-sheet-metadata.js
      - .github/workflows/qa-final-sheet-ux.yml

permissions:
  contents: read

jobs:
  browser-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Validate UX JavaScript and CSS existence
        run: |
          node --check tests/qa-final-sheet-ux.js
          test -s assets/final-sheet-ux-5r.css
          grep -F 'final-sheet-ux-5r.css?v=' index.html
      - name: Serve repository site
        run: |
          python3 -m http.server 18766 --bind 127.0.0.1 >/tmp/trpg-http.log 2>&1 &
          sleep 2
      - name: Five-width final sheet UI and 2014/2024 regression
        env:
          QA_BASE: http://127.0.0.1:18766
        run: node tests/qa-final-sheet-ux.js
      - name: Existing character sheet section shortcuts
        run: node tests/qa-final-sheet-jump-nav.js
      - name: Existing mobile and desktop sheet layout
        env:
          QA_BASE: http://127.0.0.1:18766
        run: node tests/qa-mobile-character-preview.js
      - name: Spell sheet canonical and export consistency
        run: node tests/qa-final-spell-sheet-metadata.js
      - name: Wait for the deployed Pages asset version
        if: github.ref == 'refs/heads/main'
        run: |
          ready=0
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 15 -o /tmp/uxc-index.html 'https://linheng1230.github.io/TRPG_playercheet/index.html' && grep -Fq 'final-sheet-ux-5r.css?v=20261114-sheet-c1' /tmp/uxc-index.html; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = 1
          curl -fsSL --max-time 15 -o /tmp/uxc.css 'https://linheng1230.github.io/TRPG_playercheet/assets/final-sheet-ux-5r.css?v=20261114-sheet-c1'
          grep -Fq '.fs-abrow' /tmp/uxc.css
      - name: Real GitHub Pages browser acceptance (2024 and 2014)
        if: github.ref == 'refs/heads/main'
        env:
          QA_BASE: https://linheng1230.github.io/TRPG_playercheet
        run: node tests/qa-final-sheet-ux.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-sheet-ux-360-390-480-768-1440
          path: |
            tmp/qa-final-sheet-ux/*.png
            tmp/qa-final-sheet-jump-nav-*.png
            tmp/qa-final-spell-sheet-*.png
          if-no-files-found: ignore
