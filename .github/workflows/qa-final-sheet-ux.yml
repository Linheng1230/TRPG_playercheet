name: QA Final Sheet UX Desktop Mobile

on:
  push:
    branches: [main, fix/ux-c-readability-regression-20261114]
    paths:
      - index.html
      - assets/final-sheet-ux-5r.css
      - tests/qa-final-sheet-ux.js
      - tests/qa-spell-readability.js
      - tests/qa-final-sheet-jump-nav.js
      - tests/qa-final-spell-sheet-metadata.js
      - tests/qa-final-sheet-live-ui.js
      - .github/workflows/qa-final-sheet-ux.yml
  pull_request:
    paths:
      - index.html
      - assets/final-sheet-ux-5r.css
      - tests/qa-final-sheet-ux.js
      - tests/qa-spell-readability.js
      - tests/qa-final-sheet-jump-nav.js
      - tests/qa-final-spell-sheet-metadata.js
      - tests/qa-final-sheet-live-ui.js
      - .github/workflows/qa-final-sheet-ux.yml

permissions:
  contents: read

jobs:
  browser-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Validate UX JavaScript and CSS existence
        run: |
          node --check tests/qa-final-sheet-ux.js
          node --check tests/qa-final-sheet-live-ui.js
          test -s assets/final-sheet-ux-5r.css
          grep -F 'final-sheet-ux-5r.css?v=' index.html
      - name: Serve repository site
        run: |
          python3 -m http.server 18766 --bind 127.0.0.1 >/tmp/trpg-http.log 2>&1 &
          sleep 2
      - name: Five-width final sheet UI and 2014/2024 regression
        env:
          QA_BASE: http://127.0.0.1:18766
        run: node tests/qa-final-sheet-ux.js
      - name: Fresh-browser actual clicks through creation to final sheet (2014 / 2024)
        env:
          QA_BASE: http://127.0.0.1:18766
        run: node tests/qa-final-sheet-live-ui.js
      - name: Existing character sheet section shortcuts
        run: node tests/qa-final-sheet-jump-nav.js
      - name: Existing mobile and desktop sheet layout
        env:
          QA_BASE: http://127.0.0.1:18766
        run: node tests/qa-mobile-character-preview.js
      - name: Isolated spell readability diagnostic (all viewports)
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-spell-readability.js
      - name: Spell sheet canonical and export consistency
        run: node tests/qa-final-spell-sheet-metadata.js
      - name: Wait for exact deployed source parity (index + UX stylesheet)
        if: github.ref == 'refs/heads/main'
        run: |
          expected_index=$(sha256sum index.html | cut -d ' ' -f1)
          expected_css=$(sha256sum assets/final-sheet-ux-5r.css | cut -d ' ' -f1)
          ready=0
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' -o /tmp/uxc-live-index.html "https://linheng1230.github.io/TRPG_playercheet/index.html?uat_build=$GITHUB_SHA" &&
               curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' -o /tmp/uxc-live.css "https://linheng1230.github.io/TRPG_playercheet/assets/final-sheet-ux-5r.css?uat_build=$GITHUB_SHA" &&
               test "$(sha256sum /tmp/uxc-live-index.html | cut -d ' ' -f1)" = "$expected_index" &&
               test "$(sha256sum /tmp/uxc-live.css | cut -d ' ' -f1)" = "$expected_css"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = 1
      - name: Real GitHub Pages browser acceptance (2024 and 2014)
        if: github.ref == 'refs/heads/main'
        env:
          QA_BASE: https://linheng1230.github.io/TRPG_playercheet
        run: node tests/qa-final-sheet-ux.js
      - name: Real GitHub Pages human-equivalent click UAT (fresh 2014 / 2024)
        if: github.ref == 'refs/heads/main'
        env:
          QA_BASE: https://linheng1230.github.io/TRPG_playercheet
        run: node tests/qa-final-sheet-live-ui.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-sheet-ux-360-390-480-768-1440
          path: |
            tmp/qa-final-sheet-ux/*.png
            tmp/qa-final-sheet-jump-nav-*.png
            tmp/qa-final-spell-sheet-*.png
          if-no-files-found: ignore
