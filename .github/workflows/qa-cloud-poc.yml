name: Cloud PoC Contract QA

on:
  pull_request:
    paths:
      - cloud/**
      - tests/qa-cloud-*.mjs
      - .github/workflows/qa-cloud-poc.yml
  push:
    paths:
      - cloud/**
      - tests/qa-cloud-*.mjs
      - .github/workflows/qa-cloud-poc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated cloud contract tests
        run: node --test tests/qa-cloud-*.mjs
      - name: Check whitespace errors against current main
        run: git diff --check origin/main...HEAD

  postgres-tenant-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Execute real PostgreSQL tenant / RLS / DM tests
        run: psql -X -v ON_ERROR_STOP=1 -f tests/qa-cloud-postgres-rls.sql
