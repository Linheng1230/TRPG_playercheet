name: QA 2024 Barbarian Level-Up

on:
  push:
    branches:
      - feat/barbarian-primal-mastery-ui-20261114
      - main
    paths:
      - index.html
      - tests/qa-primal-knowledge-mastery.js
      - .github/workflows/qa-primal-knowledge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local website
        run: |
          python3 -m http.server 18766 --bind 127.0.0.1 >/tmp/trpg-http.log 2>&1 &
          sleep 2
      - name: Run primal knowledge and weapon mastery browser regression
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-primal-knowledge-mastery.js
      - name: Run legacy saves, mastery labels and PDF regressions
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: |
          node tests/qa-mastery-zh-terms.js
          node tests/qa-save-migration-fixtures.js
          node tests/qa-2024-feature-pdf-coupling.js
          node tests/qa-final-sheet-jump-nav.js
