name: QA 2024 Barbarian Level-Up

on:
  push:
    branches:
      - feat/barbarian-primal-mastery-ui-20261114
      - main
    paths:
      - index.html
      - tests/qa-primal-knowledge-mastery.js
      - tests/qa-magic-item-import-browser.js
      - assets/magic-item-import-5r.js
      - assets/player-reference-5r.js
      - assets/shop-market-5r.js
      - tests/qa-shop-market-browser.js
      - .github/workflows/qa-primal-knowledge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local website
        run: |
          python3 -m http.server 18766 --bind 127.0.0.1 >/tmp/trpg-http.log 2>&1 &
          sleep 2
      - name: Run primal knowledge and weapon mastery browser regression
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-primal-knowledge-mastery.js
      - name: Browser QA magic-item import on desktop and mobile
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-magic-item-import-browser.js
      - name: Test expanded shop on desktop and mobile
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-shop-market-browser.js
      - name: Run legacy saves, mastery labels and PDF regressions
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: |
          node tests/qa-mastery-zh-terms.js
          node tests/qa-save-migration-fixtures.js
          node tests/qa-2024-feature-pdf-coupling.js
          node tests/qa-final-sheet-jump-nav.js
      - name: Verify live GitHub Pages rollout and browser behavior
        if: github.ref == 'refs/heads/main'
        env:
          QA_URL: https://linheng1230.github.io/TRPG_playercheet/index.html
        run: |
          for i in $(seq 1 40); do
            curl --fail --location --silent --show-error --max-time 15 "$QA_URL" -o /tmp/trpg-live-index.html || true
            if grep -q 'primalSkillConfirmed' /tmp/trpg-live-index.html && grep -q 'mastery-groups' /tmp/trpg-live-index.html; then
              echo "Live content verified"
              break
            fi
            if [ "$i" = "40" ]; then echo "Live Pages did not contain the published feature"; exit 1; fi
            sleep 5
          done
          node tests/qa-primal-knowledge-mastery.js
