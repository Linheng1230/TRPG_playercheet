name: WoW DLC P0 policy QA
on:
  pull_request:
    paths:
      - 'assets/wow-dlc-policy.mjs'
      - 'tests/qa-wow-dlc-*.mjs'
      - '.github/workflows/wow-dlc-p0-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source selection and GM approval
        run: node tests/qa-wow-dlc-policy.mjs
      - name: Validate P0 Chinese translation release evidence
        run: node tests/qa-wow-dlc-p0-inventory.mjs
