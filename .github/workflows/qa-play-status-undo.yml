name: QA Play Status Undo

on:
  pull_request:
    paths:
      - index.html
      - assets/play-status-undo-5r.js
      - assets/play-status-rest-5r.js
      - tests/qa-play-status-undo.js
      - tests/qa-play-status-undo-browser.js
      - tests/qa-play-status-undo-live.cjs
      - tests/qa-species-free-casts-play-status.js
      - tests/qa-species-atwill-lv1-15-matrix.cjs
      - tests/qa-play-status-species-feature-coverage.cjs
      - .github/workflows/qa-play-status-undo.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/play-status-undo-5r.js
      - assets/play-status-rest-5r.js
      - tests/qa-play-status-undo.js
      - tests/qa-play-status-undo-browser.js
      - tests/qa-species-free-casts-play-status.js
      - tests/qa-species-atwill-lv1-15-matrix.cjs
      - tests/qa-play-status-species-feature-coverage.cjs
      - .github/workflows/qa-play-status-undo.yml

permissions:
  contents: read

jobs:
  undo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-step undo rules, state and syntax
        run: |
          node tests/qa-play-status-rest.js
          node tests/qa-play-status-undo.js
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify player clicks at desktop and mobile breakpoints
        run: node tests/qa-play-status-undo-browser.js
      - name: Verify species spell resources across 13 class/species profiles and levels 1-15
        env:
          QA_URL: http://127.0.0.1:18797/index.html
          QA_MATRIX_OUT: tmp/species-atwill-lv1-15
        run: |
          python3 -m http.server 18797 --bind 127.0.0.1 >/tmp/qa-species-resource-http.log 2>&1 &
          sleep 2
          node tests/qa-species-free-casts-play-status.js
          node tests/qa-species-atwill-lv1-15-matrix.cjs
      - name: Verify all 2014/2024 species traits, subclass choices and limited-use counters
        env:
          CI: 'true'
          QA_URL: http://127.0.0.1:18797/index.html
          QA_OUTPUT: tmp/species-feature-matrix
        run: node tests/qa-play-status-species-feature-coverage.cjs
      - name: Preserve species feature coverage report and Stonecunning screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: species-feature-matrix
          path: |
            tmp/species-feature-matrix/report.json
            tmp/species-feature-matrix/dwarf-paladin-lv2-390.png
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve species resource matrix and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: species-atwill-lv1-15-matrix
          path: |
            tmp/species-atwill-lv1-15/report.json
            tmp/species-atwill-lv1-15/resource-list-*.png
          if-no-files-found: ignore
          retention-days: 14
