name: QA Play Status Undo

on:
  pull_request:
    paths:
      - index.html
      - assets/play-status-undo-5r.js
      - assets/play-status-rest-5r.js
      - tests/qa-play-status-undo.js
      - tests/qa-play-status-undo-browser.js
      - tests/qa-play-status-undo-live.cjs
      - .github/workflows/qa-play-status-undo.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/play-status-undo-5r.js
      - tests/qa-play-status-undo.js
      - tests/qa-play-status-undo-browser.js
      - .github/workflows/qa-play-status-undo.yml

permissions:
  contents: read

jobs:
  undo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-step undo rules, state and syntax
        run: |
          node tests/qa-play-status-rest.js
          node tests/qa-play-status-undo.js
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify player clicks at desktop and mobile breakpoints
        run: node tests/qa-play-status-undo-browser.js
