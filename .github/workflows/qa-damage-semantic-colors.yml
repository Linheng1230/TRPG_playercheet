name: QA Damage Semantic Colors (Phase B)

on:
  pull_request:
    paths:
      - index.html
      - assets/creator-spell-glance-2024.js
      - assets/cantrip-tooltip-2024.js
      - tests/qa-spell-condition-semantic-20261120.cjs
      - tests/qa-spell-condition-full-391-20261120.cjs
      - tests/qa-spell-condition-browser-20261120.cjs
      - assets/damage-semantic-5r.css
      - assets/damage-semantic-5r.js
      - tests/qa-damage-semantic-colors.cjs
      - tests/qa-ability-semantic-color-v1.js
      - tests/qa-ability-semantic-color-v11.js
      - tests/qa-rule-semantic-preview.js
      - tests/qa-rule-semantic-browser.js
      - assets/class-reference-5r.js
      - assets/player-reference-5r.js
      - assets/ability-lookup.js
      - assets/tool-reference-5r.js
      - .github/workflows/qa-damage-semantic-colors.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/creator-spell-glance-2024.js
      - assets/cantrip-tooltip-2024.js
      - tests/qa-spell-condition-semantic-20261120.cjs
      - tests/qa-spell-condition-full-391-20261120.cjs
      - tests/qa-spell-condition-browser-20261120.cjs
      - assets/damage-semantic-5r.css
      - assets/damage-semantic-5r.js
      - tests/qa-damage-semantic-colors.cjs
      - tests/qa-ability-semantic-color-v1.js
      - tests/qa-ability-semantic-color-v11.js
      - tests/qa-rule-semantic-preview.js
      - tests/qa-rule-semantic-browser.js
      - assets/class-reference-5r.js
      - assets/player-reference-5r.js
      - assets/ability-lookup.js
      - assets/tool-reference-5r.js
      - .github/workflows/qa-damage-semantic-colors.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK TC:lang=zh-tw' | head -1 | grep -F 'Noto Sans CJK TC'
      - name: Validate scripts
        run: |
          node --check assets/damage-semantic-5r.js
          node --check tests/qa-damage-semantic-colors.cjs
          node --check tests/qa-ability-semantic-color-v1.js
          node --check tests/qa-ability-semantic-color-v11.js
      - name: Start local website
        run: |
          python3 -m http.server 18766 --bind 127.0.0.1 >/tmp/trpg-damage-http.log 2>&1 &
          sleep 2
      - name: Browser 13-type semantics, real UI and responsive contrast
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-damage-semantic-colors.cjs
      - name: Browser six ability terms, dark popover, real Glamour route and AA contrast
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-ability-semantic-color-v1.js
      - name: Browser six ability contexts and MutationObserver redraw (v1.1)
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-ability-semantic-color-v11.js
      - name: Verify 2024 condition semantics, 391 canonical rule parity and real touch UI
        env:
          QA_BASE: http://127.0.0.1:18766/
          QA_URL: http://127.0.0.1:18766/index.html
        run: |
          node --check assets/creator-spell-glance-2024.js
          node --check assets/cantrip-tooltip-2024.js
          node --check tests/qa-spell-condition-semantic-20261120.cjs
          node --check tests/qa-spell-condition-full-391-20261120.cjs
          node --check tests/qa-spell-condition-browser-20261120.cjs
          node tests/qa-spell-condition-semantic-20261120.cjs
          node tests/qa-spell-condition-full-391-20261120.cjs
          node tests/qa-spell-condition-browser-20261120.cjs
      - name: Sitewide rule-preview semantic parity and actual browser views
        run: |
          node --check tests/qa-rule-semantic-preview.js
          node --check tests/qa-rule-semantic-browser.js
          node tests/qa-rule-semantic-preview.js
          node tests/qa-rule-semantic-browser.js
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damage-colors-desktop-narrow-mobile
          path: |
            tmp/qa-damage-semantic/
            tmp/qa-ability-semantic-*.png
            tmp/qa-spell-condition-semantic-20261120/
          if-no-files-found: ignore
