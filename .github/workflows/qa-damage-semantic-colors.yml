name: QA Damage Semantic Colors (Phase B)

on:
  pull_request:
    paths:
      - index.html
      - assets/damage-semantic-5r.css
      - assets/damage-semantic-5r.js
      - tests/qa-damage-semantic-colors.cjs
      - .github/workflows/qa-damage-semantic-colors.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/damage-semantic-5r.css
      - assets/damage-semantic-5r.js
      - tests/qa-damage-semantic-colors.cjs
      - .github/workflows/qa-damage-semantic-colors.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Validate scripts
        run: |
          node --check assets/damage-semantic-5r.js
          node --check tests/qa-damage-semantic-colors.cjs
      - name: Start local website
        run: |
          python3 -m http.server 18766 --bind 127.0.0.1 >/tmp/trpg-damage-http.log 2>&1 &
          sleep 2
      - name: Browser 13-type semantics, real UI and responsive contrast
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-damage-semantic-colors.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damage-colors-desktop-narrow-mobile
          path: tmp/qa-damage-semantic/
          if-no-files-found: ignore
