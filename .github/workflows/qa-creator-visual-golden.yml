name: Creator Watercolor Golden Visual Gate

on:
  pull_request:
    paths:
      - home.html
      - index.html
      - assets/illustrated-watercolor-ui.css
      - assets/watercolor-alpha20.css
      - assets/watercolor-alpha20.js
      - assets/watercolor-icons-alpha/**
      - assets/watercolor-ornaments/**
      - tests/qa-watercolor-portrait-redesign-20261125.cjs
      - tests/qa-watercolor-inner-icons.js
      - tests/qa-final-sheet-live-ui.js
      - tests/qa-folio-value-containment-20261125.cjs
      - assets/source/watercolor-icon-atlas.png
      - docs/design-reference/reference-mockup.webp
      - scripts/build-watercolor-alpha20.py
      - tests/qa-watercolor-alpha20.py
      - tests/qa-watercolor-alpha20-browser.js
      - .github/workflows/qa-creator-visual-golden.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full Chromium for golden screenshot browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
          QA_CHROME_CHANNEL=chromium node -e "require('playwright').chromium.launch({headless:true,channel:process.env.QA_CHROME_CHANNEL}).then(browser=>browser.close())"
      - name: Install alpha/geometry verifier tools
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Verify 20 complete source-derived PNG icons and reject legacy crop
        run: python tests/qa-watercolor-alpha20.py
      - name: Verify 20 PNG icons, class tag readability and user interaction
        env:
          QA_CHROME_CHANNEL: chromium
        run: node tests/qa-watercolor-alpha20-browser.js
      - name: Verify portrait rail, semantic artwork, equipment AC and responsive layouts
        run: |
          python -m http.server 18976 --bind 127.0.0.1 > /tmp/watercolor-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 2
          node tests/qa-watercolor-portrait-redesign-20261125.cjs
          node tests/qa-folio-value-containment-20261125.cjs
          QA_FOLIO=1 QA_BASE=http://127.0.0.1:18976 node tests/qa-final-sheet-live-ui.js
      - name: Verify all eight navigation views
        env:
          QA_CHROME_CHANNEL: chromium
        run: node tests/qa-watercolor-inner-icons.js
      - name: Upload verified screenshots and source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-alpha20-golden-${{ github.run_id }}
          path: |
            tmp/qa-watercolor-alpha20/
            tmp/qa-watercolor-portrait/
            tmp/qa-watercolor-inner-icons/
            tmp/qa-final-sheet-ux/
            tmp/qa-folio-value-containment/
          if-no-files-found: warn
          retention-days: 14
