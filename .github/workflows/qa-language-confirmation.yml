name: QA Character Language Confirmation

on:
  push:
    branches:
      - feat/language-confirm-lock-20261114
      - main
    paths:
      - index.html
      - tests/qa-language-confirmation.js
      - .github/workflows/qa-language-confirmation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local website
        run: |
          python3 -m http.server 18766 --bind 127.0.0.1 >/tmp/trpg-http.log 2>&1 &
          sleep 2
      - name: Run language confirmation end-to-end QA
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-language-confirmation.js
      - name: Legacy save and navigation regressions
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: |
          node tests/qa-save-migration-fixtures.js
          node tests/qa-final-sheet-jump-nav.js
      - name: Live GitHub Pages verification
        if: github.ref == 'refs/heads/main'
        env:
          QA_URL: https://linheng1230.github.io/TRPG_playercheet/index.html
        run: |
          for i in $(seq 1 40); do
            curl --fail --location --silent --show-error --max-time 15 "$QA_URL" -o /tmp/trpg-live-index.html || true
            if grep -q 'languageLocks' /tmp/trpg-live-index.html && grep -q 'confirmLanguages' /tmp/trpg-live-index.html; then
              echo "Live language confirmation content verified"
              break
            fi
            if [ "$i" = "40" ]; then echo "Live Pages not yet updated"; exit 1; fi
            sleep 5
          done
          node tests/qa-language-confirmation.js
