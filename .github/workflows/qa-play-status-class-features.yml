name: QA Play Status Class Features

on:
  push:
    branches:
      - feat/play-status-feature-cards-20261114
      - main
    paths:
      - index.html
      - tests/qa-star-chart-play-status.js
      - tests/qa-play-status-class-features.js
      - .github/workflows/qa-play-status-class-features.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run local website
        run: |
          python3 -m http.server 18766 --bind 127.0.0.1 >/tmp/trpg-site.log 2>&1 &
          sleep 2
      - name: Test feature cards, resource recovery, save roundtrip and responsive layouts
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-play-status-class-features.js
      - name: Preserve Star Chart resource tracking regression
        env:
          QA_URL: http://127.0.0.1:18766/index.html
        run: node tests/qa-star-chart-play-status.js
      - name: Keep rendered mobile, tablet and desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-status-class-feature-visuals
          path: tmp/qa-play-status-class-features-*.png
          if-no-files-found: ignore
      - name: Verify live GitHub Pages and browser behavior
        if: github.ref == 'refs/heads/main'
        env:
          QA_URL: https://linheng1230.github.io/TRPG_playercheet/index.html
        run: |
          for i in $(seq 1 40); do
            curl --fail --location --silent --show-error --max-time 15 "$QA_URL?verify=$GITHUB_SHA" -o /tmp/play-status-live.html || true
            if grep -q 'playStatusResourceCanonicalRule' /tmp/play-status-live.html && grep -q 'ps-feature-library' /tmp/play-status-live.html; then
              echo "Live Pages now includes Play Status feature cards"
              break
            fi
            if [ "$i" = "40" ]; then echo "Live Pages lacks published feature cards"; exit 1; fi
            sleep 5
          done
          node tests/qa-play-status-class-features.js
          node tests/qa-star-chart-play-status.js
