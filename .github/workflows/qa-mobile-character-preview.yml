name: QA Mobile Character Preview Visibility
on:
  push:
    branches: [main, fix/hide-stacked-character-preview-20261114]
    paths:
      - index.html
      - tests/qa-mobile-character-preview.js
      - .github/workflows/qa-mobile-character-preview.yml
  pull_request:
    paths:
      - index.html
      - tests/qa-mobile-character-preview.js
      - .github/workflows/qa-mobile-character-preview.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 18766 --bind 127.0.0.1 >/tmp/trpg-http.log 2>&1 &
          sleep 2
      - name: Validate responsive sidebar, quick reference and print sheet
        env:
          QA_BASE: http://127.0.0.1:18766
        run: node tests/qa-mobile-character-preview.js
