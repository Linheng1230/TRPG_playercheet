name: QA Cloud Pages Artifact Portability

on:
  pull_request:
    paths:
      - "scripts/prepare-pages-site.cjs"
      - "tests/qa-pages-artifact-portable.cjs"
      - ".github/workflows/qa-cloud-pages-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sanitized public artifact on Ubuntu
        run: node scripts/prepare-pages-site.cjs "${{ runner.temp }}/dnd5r-pages-site"
      - name: Verify portable audit path, allowlist, and raw SHA
        run: node tests/qa-pages-artifact-portable.cjs "${{ runner.temp }}/dnd5r-pages-site"
